<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주도섹터 · 주도주 10분 매트릭스</title>
<style>
:root{
  --bg:#0a0c10; --panel:#11141b; --panel-2:#161a23; --line:#232936;
  --ink:#e6e9ef; --ink-dim:#9aa3b2; --ink-faint:#616b7d;
  --up:#ff4d5e; --down:#4d8dff; --flat:#6d7688;
  --accent:#ffb020;
  --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
  --sans:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:15px; line-height:1.5;
  background-image:radial-gradient(ellipse 120% 60% at 50% -10%,#18202e 0%,transparent 70%);
  background-repeat:no-repeat;
}
.wrap{max-width:1680px;margin:0 auto;padding:20px 20px 64px}

/* ---------- 헤더 ---------- */
header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;
  padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:18px}
h1{margin:0;font-size:22px;font-weight:750;letter-spacing:-.02em}
h1 .dot{color:var(--accent)}
.sub{color:var(--ink-faint);font-size:13px;font-family:var(--mono);margin-top:2px}
.spacer{flex:1}
.hctl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-dim)}
select,button.tog{
  background:var(--panel-2);color:var(--ink);border:1px solid var(--line);
  border-radius:7px;padding:6px 11px;font-size:13px;font-family:var(--mono);cursor:pointer}
button.tog[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.badge{font-family:var(--mono);font-size:12px;padding:4px 9px;border-radius:999px;
  border:1px solid var(--line);background:var(--panel-2);color:var(--ink-dim)}
.badge.live{border-color:rgba(255,77,94,.5);color:var(--up)}
.badge.live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--up);margin-right:6px;vertical-align:1px;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* ---------- 주도섹터 카드 ---------- */
.leaders{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
  position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--accent);opacity:.9}
.card .rank{font-family:var(--mono);font-size:12px;color:var(--ink-faint);letter-spacing:.08em}
.card .sname{font-size:19px;font-weight:700;margin:2px 0 6px;letter-spacing:-.01em}
.card .schg{font-family:var(--mono);font-size:27px;font-weight:700;letter-spacing:-.02em}
.card .meta{font-family:var(--mono);font-size:12.5px;color:var(--ink-faint);margin-top:2px}
.card .lead{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);
  display:flex;align-items:baseline;gap:8px;font-size:14.5px}
.card .lead .tag{font-size:11px;color:var(--ink-faint);font-family:var(--mono)}
.card .lead .nm{font-weight:650}
.card .lead .pc{font-family:var(--mono);margin-left:auto;font-weight:650}

/* ---------- 매트릭스 ---------- */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:10px}
.toolbar .lbl{font-size:13px;color:var(--ink-faint)}
.legend{display:flex;align-items:center;gap:4px;margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--ink-faint)}
.legend i{width:16px;height:11px;border-radius:2px;display:block}

.matrix-shell{border:1px solid var(--line);border-radius:12px;overflow:auto;background:var(--panel);
  max-height:min(72vh,860px)}
table{border-collapse:separate;border-spacing:0;width:100%;font-family:var(--mono);font-size:12.5px}
thead th.spacer-c{width:99%}
thead th{position:sticky;top:0;z-index:3;background:var(--panel-2);color:var(--ink-faint);
  font-weight:500;padding:8px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
thead th.sticky-l{left:0;z-index:5;text-align:left;padding-left:14px}
th.sticky-l,td.sticky-l{position:sticky;left:0;background:var(--panel);z-index:2;
  border-right:1px solid var(--line);min-width:258px;max-width:258px}
tbody tr:hover td{background-color:rgba(255,255,255,.028)}
tbody tr:hover td.sticky-l{background:var(--panel-2)}
td{padding:0;text-align:center;border-bottom:1px solid rgba(35,41,54,.55)}

.srow td.sticky-l{cursor:pointer;padding:7px 10px 7px 14px}
.srow.open td.sticky-l{box-shadow:inset 3px 0 0 var(--accent)}
.slabel{display:flex;align-items:center;gap:8px}
.caret{color:var(--ink-faint);font-size:10px;width:10px;transition:transform .15s}
.srow.open .caret{transform:rotate(90deg);color:var(--accent)}
.sname-c{font-family:var(--sans);font-size:15px;font-weight:650;letter-spacing:-.01em}
.snum{margin-left:auto;font-weight:700;font-size:13.5px}
.leadline{display:flex;align-items:center;gap:6px;margin:3px 0 0 17px;font-size:12px;color:var(--ink-faint)}
.leadline .k{font-family:var(--sans);color:var(--ink-dim);font-weight:600}
.leadline .v{margin-left:auto;font-weight:650}

.cell{display:block;min-width:42px;height:29px;line-height:29px;font-size:11.5px;font-variant-numeric:tabular-nums;
  cursor:pointer;color:rgba(255,255,255,.85)}
.cell.empty{color:var(--ink-faint);opacity:.25}
.cell.sel{outline:1.5px solid var(--accent);outline-offset:-2px}

.trow td{border-bottom:1px solid rgba(35,41,54,.35)}
.trow td.sticky-l{padding:3px 10px 3px 32px;background:#0d1016}
.trow:hover td.sticky-l{background:#12161f}
.tname{display:flex;align-items:center;gap:7px;font-family:var(--sans);font-size:13.5px;color:var(--ink-dim)}
.tname .code{font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
.tname .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tname .chg{margin-left:auto;font-family:var(--mono);font-weight:650;font-size:12.5px}
.crown{color:var(--accent)}
.trow .cell{height:21px;line-height:21px;font-size:0}

/* ---------- 상세 패널 ---------- */
.detail{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.detail h2{margin:0 0 2px;font-size:17px;font-weight:700}
.detail .dsub{font-family:var(--mono);font-size:12.5px;color:var(--ink-faint);margin-bottom:12px}
.dtable{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:13.5px}
.dtable th{text-align:right;color:var(--ink-faint);font-weight:500;font-size:12px;
  padding:5px 8px;border-bottom:1px solid var(--line)}
.dtable th:nth-child(1),.dtable th:nth-child(2){text-align:left}
.dtable td{padding:5px 8px;text-align:right;border-bottom:1px solid rgba(35,41,54,.5)}
.dtable td:nth-child(1){color:var(--ink-faint);text-align:left;width:28px}
.dtable td:nth-child(2){text-align:left;font-family:var(--sans);font-weight:600}
.bar{height:4px;border-radius:2px;background:var(--flat);opacity:.55}
.empty-note{color:var(--ink-faint);font-size:14px;padding:8px 0}
footer{margin-top:22px;color:var(--ink-faint);font-size:12.5px;font-family:var(--mono);
  display:flex;flex-wrap:wrap;gap:10px}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
@media (max-width:820px){
  th.sticky-l,td.sticky-l{min-width:210px;max-width:210px}
  .tname .code{display:none}
  .card .schg{font-size:22px}
}

/* ---------- 탭 ---------- */
.tabs{display:flex;gap:4px;background:var(--panel-2);border:1px solid var(--line);
  border-radius:9px;padding:3px}
.tabs button{background:transparent;border:0;color:var(--ink-dim);font-family:var(--sans);
  font-size:14px;font-weight:650;padding:7px 15px;border-radius:6px;cursor:pointer;
  letter-spacing:-.01em;transition:background .12s,color .12s}
.tabs button[aria-selected="true"]{background:#232b3a;color:#fff;
  box-shadow:0 0 0 1px rgba(255,176,32,.35) inset}
[hidden]{display:none !important}

/* ---------- 매수금액 순위 ---------- */
.rank-top{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px 14px}
.stat .k{font-size:12px;color:var(--ink-faint);font-family:var(--mono)}
.stat .v{font-family:var(--mono);font-size:23px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.stat .s{font-size:12px;color:var(--ink-faint);font-family:var(--mono)}

.conc{background:var(--panel);border:1px solid var(--line);border-radius:11px;
  padding:13px 15px;margin-bottom:16px}
.conc h3{margin:0 0 10px;font-size:14px;font-weight:650;color:var(--ink-dim)}
.crow{display:flex;align-items:center;gap:9px;margin-bottom:6px;font-size:13.5px}
.crow .nm{width:112px;flex:none;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .tr{flex:1;height:9px;background:#1b2130;border-radius:5px;overflow:hidden}
.crow .tr i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#ff4d5e,#ff8a4d)}
.crow .pv{width:104px;flex:none;text-align:right;font-family:var(--mono);font-size:12.5px;color:var(--ink-dim)}

.rank-shell{border:1px solid var(--line);border-radius:12px;overflow:auto;background:var(--panel)}
.rtable{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:13.5px}
.rtable thead th{position:sticky;top:0;background:var(--panel-2);color:var(--ink-faint);
  font-weight:500;font-size:12px;text-align:right;padding:10px 11px;
  border-bottom:1px solid var(--line);white-space:nowrap}
.rtable thead th:nth-child(-n+4){text-align:left}
.rtable td{padding:7px 10px;text-align:right;border-bottom:1px solid rgba(35,41,54,.5);white-space:nowrap}
.rtable tbody tr:hover{background:rgba(255,255,255,.03)}
.rtable td.rk{text-align:left;width:34px;color:var(--ink-faint);font-weight:700}
.rtable td.mv{text-align:left;width:56px;font-size:12px}
.rtable td.nm{text-align:left;font-family:var(--sans);font-weight:650;font-size:14.5px}
.rtable td.sec{text-align:left;width:104px}
.rtable tr.top3 td.rk{color:var(--accent)}
.rtable tr.is-etf{opacity:.62}
.sectag{display:inline-block;font-family:var(--sans);font-size:12px;font-weight:600;
  padding:2px 7px;border-radius:5px;background:rgba(255,176,32,.13);color:var(--accent);
  border:1px solid rgba(255,176,32,.25)}
.sectag.etf{background:rgba(154,163,178,.12);color:var(--ink-faint);border-color:var(--line)}
.mv .up-a{color:var(--up)} .mv .dn-a{color:var(--down)}
.mv .new{color:var(--accent);font-weight:700}
.mv .same{color:var(--ink-faint)}
.amtbar{display:inline-block;vertical-align:middle;height:7px;border-radius:4px;
  background:linear-gradient(90deg,rgba(255,77,94,.85),rgba(255,138,77,.85));min-width:2px}
.rtable td.flow-na{color:var(--ink-faint);opacity:.5;cursor:help}
.rtable tbody tr[data-code]{cursor:pointer}
.rtable tbody tr.rsel{background:rgba(255,176,32,.08)}
.rtable tbody tr.rsel td:first-child{box-shadow:inset 3px 0 0 var(--accent)}

/* ---------- 종목 수급 상세(매수/매도/순매수) ---------- */
.dtable-flow th{text-align:center !important}
.dtable-flow td{text-align:center;vertical-align:middle}
.dtable-flow td.dlabel{text-align:left;font-family:var(--sans);font-weight:650;color:var(--ink-dim);
  white-space:nowrap;min-width:74px}
.dtable-flow th:first-child{min-width:74px}
.ddir{display:flex;flex-direction:column;align-items:center;line-height:1.3}
.ddir .dv{font-weight:700;font-size:13px}
.ddir .dv.na{color:var(--ink-faint);font-weight:400}
.ddir .dq{font-size:10.5px;color:var(--ink-faint)}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div>
    <h1>주도섹터 <span class="dot">·</span> 주도주 매트릭스</h1>
    <div class="sub" id="stamp">—</div>
  </div>
  <div class="tabs" role="tablist">
    <button role="tab" data-view="matrix" aria-selected="true">섹터 매트릭스</button>
    <button role="tab" data-view="rank" aria-selected="false">매수금액 TOP 30</button>
  </div>
  <div class="spacer"></div>
  <div class="hctl">
    <span id="live" class="badge">—</span>
    <select id="dateSel" title="날짜 선택"></select>
    <span id="nowClock" class="badge" title="현재 시각">—</span>
    <button class="tog" id="autoBtn" aria-pressed="false" title="60초마다 자동 새로고침">자동갱신</button>
  </div>
</header>

<div id="view-matrix">
<section class="leaders" id="leaders"></section>

<div class="toolbar">
  <span class="lbl">정렬</span>
  <button class="tog" data-sort="chg" aria-pressed="true">현재 강도</button>
  <button class="tog" data-sort="mom" aria-pressed="false">최근 10분 모멘텀</button>
  <button class="tog" data-sort="amt" aria-pressed="false">거래대금</button>
  <span class="lbl" style="margin-left:8px">|</span>
  <button class="tog" id="expandAll" aria-pressed="false">전 섹터 종목 펼치기</button>
  <div class="legend">
    <span>-3%</span>
    <i style="background:rgba(77,141,255,.85)"></i><i style="background:rgba(77,141,255,.5)"></i>
    <i style="background:rgba(77,141,255,.2)"></i><i style="background:#161a23"></i>
    <i style="background:rgba(255,77,94,.2)"></i><i style="background:rgba(255,77,94,.5)"></i>
    <i style="background:rgba(255,77,94,.85)"></i>
    <span>+3%</span>
  </div>
</div>

<div class="matrix-shell">
  <table id="matrix"><thead></thead><tbody></tbody></table>
</div>

<section class="detail" id="detail"></section>
</div><!-- /view-matrix -->

<div id="view-rank" hidden>
  <div class="toolbar">
    <span class="lbl">기준 시각</span>
    <select id="rankSlot"></select>
    <span class="lbl" style="margin-left:auto">거래대금(매수금액) 상위 30 · 코스피+코스닥 개별종목 (ETF 제외)</span>
  </div>
  <div class="rank-top" id="rankStats"></div>
  <div class="conc" id="rankConc"></div>
  <div class="rank-shell">
    <table class="rtable" id="rankTable"><thead></thead><tbody></tbody></table>
  </div>
  <section class="detail" id="rankDetail"></section>
</div>

<footer>
  <span>데이터: 한국투자증권 Open API · 10분 단위 스냅샷</span>
  <span>섹터 등락률 = 구성종목 등락률 단순평균</span>
  <span>주도주 = 해당 시점 섹터 내 등락률 1위</span>
</footer>
</div>

<script>
const PAYLOAD = /*__PAYLOAD__*/null;

/* ---------------- 유틸 ---------------- */
const $ = s => document.querySelector(s);
const hhmm = t => t.slice(0,2) + ":" + t.slice(2);
const sign = v => (v > 0 ? "+" : "") + v.toFixed(2);
const cls  = v => v > 0 ? "up" : v < 0 ? "down" : "flat";

// 거래대금(억) -> 사람이 읽는 표기
function amtText(eok){
  if (eok >= 10000) return (eok/10000).toFixed(2) + "조";
  if (eok >= 1000)  return Math.round(eok).toLocaleString() + "억";
  return eok.toFixed(0) + "억";
}

// 등락률 -> 히트맵 배경색 (한국식: 상승 빨강 / 하락 파랑, ±3% 에서 최대 농도)
function heat(v){
  if (v === null || v === undefined) return "transparent";
  const a = Math.min(Math.abs(v) / 3, 1);
  const alpha = 0.07 + a * 0.78;
  return v >= 0 ? `rgba(255,77,94,${alpha.toFixed(3)})`
                : `rgba(77,141,255,${alpha.toFixed(3)})`;
}

/* ---------------- 상태 ---------------- */
let DATA = PAYLOAD;              // 현재 화면에 그려진 하루치 데이터
let sortKey = "chg";             // 섹터 정렬 기준
let openSectors = new Set();     // 펼쳐진 섹터
let selected = null;             // 선택된 셀 {sector, slotIdx}
let autoTimer = null;

/* ---------------- 집계 ---------------- */
// 실제로 데이터가 들어온 슬롯만 사용 (아직 안 지난 시간대는 그리지 않음)
function usedSlots(){ return DATA.slots.map(s => s.t); }

// 특정 슬롯·섹터의 집계값
function agg(slot, sector){
  const members = DATA.universe[sector];
  let sum = 0, n = 0, amt = 0, up = 0, down = 0, best = null;
  for (const [code, name] of members){
    const r = slot.d[code];
    if (!r) continue;
    const [chg, price, a] = r;
    sum += chg; n++; amt += a;
    if (chg > 0) up++; else if (chg < 0) down++;
    if (!best || chg > best.chg) best = {code, name, chg, price, amt:a};
  }
  if (!n) return null;
  return {chg: sum/n, amt, up, down, n, leader: best};
}

// 섹터별 [슬롯index -> 집계] 행 전체
function buildRows(){
  const slots = DATA.slots;
  const rows = Object.keys(DATA.universe).map(sector => {
    const series = slots.map(s => agg(s, sector));
    const last = series.length ? series[series.length-1] : null;
    const prev = series.length > 1 ? series[series.length-2] : null;
    return {
      sector, series, last,
      chg: last ? last.chg : 0,
      amt: last ? last.amt : 0,
      mom: (last && prev) ? last.chg - prev.chg : 0,
    };
  });
  rows.sort((a,b) => b[sortKey] - a[sortKey]);
  return rows;
}

/* ---------------- 렌더 ---------------- */
function renderStamp(){
  const d = DATA.date;
  const pretty = `${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6)}`;
  const n = DATA.slots.length;
  const lastT = n ? hhmm(DATA.slots[n-1].t) : "—";
  $("#stamp").textContent =
    `${pretty} · 마지막 스냅샷 ${lastT} · 슬롯 ${n}개 · 종목 ${Object.values(DATA.universe).flat().length}개`;

  const live = $("#live");
  const now = new Date();
  const kst = new Date(now.toLocaleString("en-US", {timeZone:"Asia/Seoul"}));
  const hm = kst.getHours()*100 + kst.getMinutes();
  const isToday = DATA.date === `${kst.getFullYear()}${String(kst.getMonth()+1).padStart(2,"0")}${String(kst.getDate()).padStart(2,"0")}`;
  const open = isToday && kst.getDay() >= 1 && kst.getDay() <= 5 && hm >= 900 && hm <= 1535;
  live.textContent = open ? "장중" : "장 마감";
  live.className = "badge" + (open ? " live" : "");
}

function renderLeaders(rows){
  const top = rows.slice().sort((a,b) => b.chg - a.chg).slice(0,4);
  $("#leaders").innerHTML = top.map((r,i) => {
    if (!r.last) return "";
    const L = r.last.leader;
    return `<div class="card">
      <div class="rank">주도섹터 #${i+1}</div>
      <div class="sname">${r.sector}</div>
      <div class="schg ${cls(r.chg)}">${sign(r.chg)}<span style="font-size:15px">%</span></div>
      <div class="meta">상승 ${r.last.up} / 하락 ${r.last.down} · 총 ${r.last.n}종목</div>
      <div class="meta">거래대금 ${amtText(r.last.amt)} · 최근 10분 ${sign(r.mom)}p</div>
      <div class="lead">
        <span class="tag">주도주</span>
        <span class="nm">${L.name}</span>
        <span class="pc ${cls(L.chg)}">${sign(L.chg)}%</span>
      </div>
    </div>`;
  }).join("") || `<div class="empty-note">아직 수집된 스냅샷이 없습니다.</div>`;
}

function renderMatrix(rows){
  const slots = DATA.slots;
  const thead = `<tr>
    <th class="sticky-l">섹터 / 주도주</th>
    ${slots.map(s => `<th>${hhmm(s.t)}</th>`).join("")}
    <th class="spacer-c"></th>
  </tr>`;
  $("#matrix thead").innerHTML = thead;

  const body = rows.map(r => {
    const L = r.last ? r.last.leader : null;
    const head = `<td class="sticky-l">
      <div class="slabel">
        <span class="caret">▶</span>
        <span class="sname-c">${r.sector}</span>
        <span class="snum ${cls(r.chg)}">${r.last ? sign(r.chg)+"%" : "—"}</span>
      </div>
      ${L ? `<div class="leadline">
        <span class="crown">★</span><span class="k">${L.name}</span>
        <span class="v ${cls(L.chg)}">${sign(L.chg)}%</span></div>` : ""}
    </td>`;

    const cells = r.series.map((a,i) => {
      if (!a) return `<td><span class="cell empty">·</span></td>`;
      const sel = (selected && selected.sector === r.sector && selected.i === i) ? " sel" : "";
      return `<td><span class="cell${sel}" style="background:${heat(a.chg)}"
        data-sector="${r.sector}" data-i="${i}"
        title="${r.sector} ${hhmm(slots[i].t)} · 평균 ${sign(a.chg)}% · 주도주 ${a.leader.name} ${sign(a.leader.chg)}%"
        >${a.chg.toFixed(1)}</span></td>`;
    }).join("");

    const pad = "<td></td>";
    let out = `<tr class="srow${openSectors.has(r.sector) ? " open" : ""}" data-sector="${r.sector}">${head}${cells}${pad}</tr>`;

    if (openSectors.has(r.sector)){
      // 섹터 내 종목을 현재 등락률 순으로 정렬해 종목 × 시간 미니 매트릭스를 붙인다
      const lastSlot = slots[slots.length-1];
      const members = DATA.universe[r.sector].slice().sort((a,b) => {
        const av = lastSlot && lastSlot.d[a[0]] ? lastSlot.d[a[0]][0] : -999;
        const bv = lastSlot && lastSlot.d[b[0]] ? lastSlot.d[b[0]][0] : -999;
        return bv - av;
      });
      out += members.map(([code,name], idx) => {
        const cur = lastSlot ? lastSlot.d[code] : null;
        const c = cur ? cur[0] : null;
        const tcells = slots.map(s => {
          const v = s.d[code];
          return v ? `<td><span class="cell" style="background:${heat(v[0])}"
              title="${name} ${hhmm(s.t)} · ${sign(v[0])}% · ${v[1].toLocaleString()}원"></span></td>`
            : `<td><span class="cell empty"></span></td>`;
        }).join("");
        return `<tr class="trow">
          <td class="sticky-l"><div class="tname">
            <span class="code">${code}</span>
            <span class="n">${idx===0 ? '<span class="crown">★</span> ' : ""}${name}</span>
            <span class="chg ${c===null?"flat":cls(c)}">${c===null ? "—" : sign(c)+"%"}</span>
          </div></td>${tcells}${pad}</tr>`;
      }).join("");
    }
    return out;
  }).join("");

  $("#matrix tbody").innerHTML = body ||
    `<tr><td class="sticky-l"><span class="empty-note">데이터 없음</span></td></tr>`;
}

function renderDetail(){
  const el = $("#detail");
  if (!selected || !DATA.slots.length){
    el.innerHTML = `<h2>구간 상세</h2>
      <div class="dsub">매트릭스에서 셀을 클릭하면 그 시각·그 섹터의 종목 순위가 여기에 표시됩니다.</div>`;
    return;
  }
  const slot = DATA.slots[selected.i];
  const a = agg(slot, selected.sector);
  if (!a){ el.innerHTML = `<h2>${selected.sector}</h2><div class="dsub">해당 구간 데이터 없음</div>`; return; }

  const rows = DATA.universe[selected.sector]
    .map(([code,name]) => ({code, name, r: slot.d[code]}))
    .filter(x => x.r)
    .sort((x,y) => y.r[0] - x.r[0]);
  const maxAmt = Math.max(...rows.map(x => x.r[2]), 1);

  el.innerHTML = `
    <h2>${selected.sector} <span style="font-size:13px;color:var(--ink-faint);font-family:var(--mono)">
      ${hhmm(slot.t)}</span></h2>
    <div class="dsub">평균 <b class="${cls(a.chg)}">${sign(a.chg)}%</b>
      · 상승 ${a.up} / 하락 ${a.down} (총 ${a.n}) · 거래대금 ${amtText(a.amt)}
      · 주도주 <b>${a.leader.name}</b> <b class="${cls(a.leader.chg)}">${sign(a.leader.chg)}%</b></div>
    <table class="dtable">
      <thead><tr><th>#</th><th>종목</th><th>등락률</th><th>현재가</th><th>거래대금</th><th style="width:26%">비중</th></tr></thead>
      <tbody>${rows.map((x,i) => `
        <tr>
          <td>${i+1}</td>
          <td>${i===0 ? '<span class="crown">★</span> ' : ""}${x.name}
              <span style="color:var(--ink-faint);font-family:var(--mono);font-size:11px">${x.code}</span></td>
          <td class="${cls(x.r[0])}"><b>${sign(x.r[0])}%</b></td>
          <td>${x.r[1].toLocaleString()}</td>
          <td>${amtText(x.r[2])}</td>
          <td><div class="bar" style="width:${(x.r[2]/maxAmt*100).toFixed(1)}%;
              background:${x.r[0]>=0?"var(--up)":"var(--down)"}"></div></td>
        </tr>`).join("")}</tbody>
    </table>`;
}

function render(){
  renderStamp();
  const rows = buildRows();
  renderLeaders(rows);
  renderMatrix(rows);
  renderDetail();
  if (curView === "rank") renderRank();
}

/* ---------------- 이벤트 ---------------- */
document.addEventListener("click", e => {
  const cell = e.target.closest(".cell[data-sector]");
  if (cell){
    selected = {sector: cell.dataset.sector, i: +cell.dataset.i};
    render();
    return;
  }
  const srow = e.target.closest(".srow");
  if (srow && e.target.closest("td.sticky-l")){
    const s = srow.dataset.sector;
    openSectors.has(s) ? openSectors.delete(s) : openSectors.add(s);
    render();
    return;
  }
  const rrow = e.target.closest("#rankTable tbody tr[data-code]");
  if (rrow){
    const code = rrow.dataset.code;
    selectedRankCode = (selectedRankCode === code) ? null : code;
    renderRank();
    $("#rankDetail").scrollIntoView({behavior: "smooth", block: "nearest"});
  }
});

document.querySelectorAll("[data-sort]").forEach(b => b.addEventListener("click", () => {
  sortKey = b.dataset.sort;
  document.querySelectorAll("[data-sort]").forEach(x =>
    x.setAttribute("aria-pressed", String(x === b)));
  render();
}));

$("#expandAll").addEventListener("click", e => {
  const on = e.currentTarget.getAttribute("aria-pressed") !== "true";
  e.currentTarget.setAttribute("aria-pressed", String(on));
  openSectors = on ? new Set(Object.keys(DATA.universe)) : new Set();
  render();
});

$("#autoBtn").addEventListener("click", e => {
  const on = e.currentTarget.getAttribute("aria-pressed") !== "true";
  e.currentTarget.setAttribute("aria-pressed", String(on));
  if (autoTimer){ clearInterval(autoTimer); autoTimer = null; }
  if (on) autoTimer = setInterval(() => location.reload(), 60000);
});

// 날짜 전환 — 정적 호스팅(깃허브 페이지)에서는 data/YYYYMMDD.json 을 직접 불러온다
const sel = $("#dateSel");
sel.innerHTML = (PAYLOAD.available_dates || [PAYLOAD.date]).slice().reverse()
  .map(d => `<option value="${d}"${d===PAYLOAD.date?" selected":""}>${d.slice(4,6)}/${d.slice(6)}</option>`).join("");
sel.addEventListener("change", async () => {
  const d = sel.value;
  if (d === DATA.date) return;
  try{
    const res = await fetch(`data/${d}.json`, {cache:"no-store"});
    const day = await res.json();
    DATA = {...PAYLOAD, date: day.date, updated_at: day.updated_at, slots: day.slots};
    selected = null; rankIdx = null; render();
  }catch(err){
    alert("과거 날짜는 웹 서버로 열었을 때만 조회할 수 있습니다 (file:// 제한).");
    sel.value = DATA.date;
  }
});

/* ---------------- 매수금액 TOP 30 ---------------- */
let curView   = "matrix";   // 현재 탭
let rankIdx   = null;       // 순위표 기준 슬롯 (null = 가장 최근)

// 종목코드 -> 우리 섹터 유니버스상의 섹터명 (없으면 null)
const CODE2SEC = (() => {
  const m = {};
  for (const [sec, members] of Object.entries(PAYLOAD.universe))
    for (const [code] of members) m[code] = sec;
  return m;
})();

// 순위 데이터가 실제로 들어있는 슬롯만 대상으로
function rankSlots(){ return DATA.slots.filter(s => s.r && s.r.length); }

function activeRankIdx(){
  const rs = rankSlots();
  if (!rs.length) return -1;
  const idx = DATA.slots.indexOf(rs[rs.length - 1]);
  return (rankIdx === null || !DATA.slots[rankIdx]?.r?.length) ? idx : rankIdx;
}

function renderRank(){
  const i = activeRankIdx();
  const sel = $("#rankSlot");
  const rs = rankSlots();

  sel.innerHTML = rs.map(s => {
    const k = DATA.slots.indexOf(s);
    return `<option value="${k}"${k===i?" selected":""}>${hhmm(s.t)}</option>`;
  }).join("");

  if (i < 0){
    $("#rankStats").innerHTML = "";
    $("#rankConc").innerHTML = `<div class="empty-note">아직 수집된 순위 데이터가 없습니다.</div>`;
    $("#rankTable thead").innerHTML = "";
    $("#rankTable tbody").innerHTML = "";
    return;
  }

  const rowsAll = DATA.slots[i].r;
  // 직전(순위가 있는) 슬롯과 비교해 순위 변동을 계산
  const prevSlot = rankSlots().filter(s => DATA.slots.indexOf(s) < i).pop();
  const prevRank = {};
  if (prevSlot) prevSlot.r.forEach((x, k) => { prevRank[x[0]] = k + 1; });

  const rows = rowsAll;

  // ── 요약 지표
  const totalAmt = rowsAll.reduce((a, x) => a + x[4], 0);
  const kospiAmt = rowsAll.filter(x => x[7] === "코스피").reduce((a, x) => a + x[4], 0);
  const kospiCnt = rowsAll.filter(x => x[7] === "코스피").length;
  const upCnt    = rowsAll.filter(x => x[3] > 0).length;
  const newCnt   = prevSlot ? rowsAll.filter(x => !(x[0] in prevRank)).length : 0;
  $("#rankStats").innerHTML = `
    <div class="stat"><div class="k">상위 30 거래대금</div>
      <div class="v">${amtText(totalAmt)}</div>
      <div class="s">코스피 ${kospiCnt}종목 ${amtText(kospiAmt)} · 코스닥 ${rowsAll.length-kospiCnt}종목 ${amtText(totalAmt-kospiAmt)}</div></div>
    <div class="stat"><div class="k">상승 / 하락</div>
      <div class="v"><span class="up">${upCnt}</span> <span style="color:var(--ink-faint)">/</span>
        <span class="down">${rowsAll.length-upCnt}</span></div>
      <div class="s">30종목 기준</div></div>
    <div class="stat"><div class="k">신규 진입</div>
      <div class="v ${newCnt?"":"flat"}">${prevSlot ? newCnt : "—"}</div>
      <div class="s">${prevSlot ? "직전 "+hhmm(prevSlot.t)+" 대비" : "비교할 직전 슬롯 없음"}</div></div>
    <div class="stat"><div class="k">1위 종목</div>
      <div class="v" style="font-size:18px">${rowsAll[0][1]}</div>
      <div class="s ${cls(rowsAll[0][3])}">${sign(rowsAll[0][3])}% · ${amtText(rowsAll[0][4])}</div></div>`;

  // ── 섹터 쏠림: 상위 30의 거래대금을 우리 섹터 기준으로 묶는다
  const bySec = {};
  for (const x of rowsAll){
    const key = CODE2SEC[x[0]] || "기타(유니버스 외)";
    bySec[key] = (bySec[key] || 0) + x[4];
  }
  const concRows = Object.entries(bySec).sort((a,b) => b[1]-a[1]).slice(0,7);
  const maxC = concRows.length ? concRows[0][1] : 1;
  $("#rankConc").innerHTML = `<h3>상위 30 자금 쏠림 (거래대금 기준)</h3>` +
    concRows.map(([k,v]) => `<div class="crow">
      <span class="nm">${k}</span>
      <span class="tr"><i style="width:${(v/maxC*100).toFixed(1)}%"></i></span>
      <span class="pv">${amtText(v)} · ${(v/totalAmt*100).toFixed(1)}%</span>
    </div>`).join("");

  // ── 순위표
  $("#rankTable thead").innerHTML = `<tr>
    <th>#</th><th>변동</th><th>종목</th><th>섹터</th>
    <th>등락률</th><th>현재가</th><th>거래대금</th><th style="width:12%">비중</th>
    <th>거래량</th><th>거래량증가율</th>
    <th>외국인 순매수</th><th>기관 순매수</th><th>프로그램 순매수</th></tr>`;

  // 외국인/기관/프로그램 순매수 셀 — amt(억원) 가 null 이면 그 시점 잠정 랭킹 밖이라 값이 없다는 뜻
  function flowCell(qty, amt){
    if (amt === null || amt === undefined){
      return `<td class="flow-na" title="장중 잠정 상위 랭킹 밖이라 조회 불가">—</td>`;
    }
    const qtyTx = qty === null ? "" :
      (Math.abs(qty) >= 10000 ? `${(qty/10000).toFixed(1)}만주` : `${qty.toLocaleString()}주`);
    return `<td class="${cls(amt)}" title="${qtyTx}"><b>${amt>=0?"+":""}${amt.toLocaleString()}억</b></td>`;
  }

  const maxAmt = Math.max(...rows.map(x => x[4]), 1);
  $("#rankTable tbody").innerHTML = rows.map(x => {
    const [code, name, price, chg, amt, vol, vinr, market,
           frgnQty, frgnAmt, orgnQty, orgnAmt, progQty, progAmt] = x;
    const rk = rowsAll.indexOf(x) + 1;
    const pv = prevRank[code];
    let mv = `<span class="same">—</span>`;
    if (prevSlot){
      if (pv === undefined) mv = `<span class="new">NEW</span>`;
      else if (pv > rk) mv = `<span class="up-a">▲${pv-rk}</span>`;
      else if (pv < rk) mv = `<span class="dn-a">▼${rk-pv}</span>`;
    }
    const sec = CODE2SEC[code]
      ? `<span class="sectag">${CODE2SEC[code]}</span>`
      : `<span class="sectag etf">${market}</span>`;
    return `<tr class="${rk<=3?"top3":""}${code===selectedRankCode?" rsel":""}" data-code="${code}">
      <td class="rk">${rk}</td>
      <td class="mv">${mv}</td>
      <td class="nm">${name} <span style="color:var(--ink-faint);font-size:11px">${code}</span></td>
      <td class="sec">${sec}</td>
      <td class="${cls(chg)}"><b>${sign(chg)}%</b></td>
      <td>${price.toLocaleString()}</td>
      <td>${amtText(amt)}</td>
      <td><span class="amtbar" style="width:${(amt/maxAmt*100).toFixed(1)}%"></span></td>
      <td>${vol.toLocaleString()}</td>
      <td class="${vinr>=100?"up":"flat"}">${vinr.toFixed(0)}%</td>
      ${flowCell(frgnQty, frgnAmt)}
      ${flowCell(orgnQty, orgnAmt)}
      ${flowCell(progQty, progAmt)}
    </tr>`;
  }).join("");

  renderRankDetail(rowsAll);
}

/* ---------------- 종목 상세: 매수/매도/순매수 (프로그램·외국인·기관·전일확정) ---------------- */
let selectedRankCode = null;

// 매도/매수 총량(항상 양수, 부호·색 없음) — [수량, 금액(억)]
function grossCell(qty, amt){
  if (qty === null || qty === undefined) return `<div class="ddir"><span class="dv na">—</span></div>`;
  const qtyTx = qty >= 10000 ? `${(qty/10000).toFixed(1)}만주` : `${qty.toLocaleString()}주`;
  return `<div class="ddir"><span class="dv">${amt.toLocaleString()}억</span><span class="dq">${qtyTx}</span></div>`;
}

// 순매수(부호 있음, 방향에 따라 색) — [수량, 금액(억)]
function netCell(qty, amt){
  if (qty === null || qty === undefined) return `<div class="ddir"><span class="dv na">—</span></div>`;
  const qtyTx = Math.abs(qty) >= 10000 ? `${(qty/10000).toFixed(1)}만주` : `${Math.abs(qty).toLocaleString()}주`;
  return `<div class="ddir"><span class="dv ${cls(amt)}">${amt>=0?"+":""}${amt.toLocaleString()}억</span><span class="dq">${qtyTx}</span></div>`;
}

// 매도/매수/순매수 3방향을 한 줄로 — trio = [매도량,매수량,순매수량,매도대금,매수대금,순매수대금] 또는 null
function trioRow(label, trio){
  if (!trio){
    return `<tr><td class="dlabel">${label}</td><td colspan="3" class="empty-note" style="padding:6px 0">데이터 없음</td></tr>`;
  }
  const [sQty, bQty, nQty, sAmt, bAmt, nAmt] = trio;
  return `<tr>
    <td class="dlabel">${label}</td>
    <td>${grossCell(sQty, sAmt)}</td>
    <td>${grossCell(bQty, bAmt)}</td>
    <td>${netCell(nQty, nAmt)}</td>
  </tr>`;
}

function renderRankDetail(rowsAll){
  const el = $("#rankDetail");
  if (!selectedRankCode){
    el.innerHTML = `<h2>종목 수급 상세</h2>
      <div class="dsub">순위표에서 종목을 클릭하면 프로그램·외국인·기관의 매수/매도/순매수 내역이 여기에 표시됩니다.</div>`;
    return;
  }
  const row = rowsAll.find(x => x[0] === selectedRankCode);
  if (!row){
    el.innerHTML = `<h2>종목 수급 상세</h2><div class="dsub">이 시각 순위표에는 없는 종목입니다.</div>`;
    return;
  }
  const [code, name, , , , , , , frgnQty, frgnAmt, orgnQty, orgnAmt, progQty, progAmt,
         progBuyQty, progSellQty, progBuyAmt, progSellAmt, daily] = row;

  const progTrio = progQty === null ? null : [progSellQty, progBuyQty, progQty, progSellAmt, progBuyAmt, progAmt];

  el.innerHTML = `
    <h2>${name} <span style="font-size:12px;color:var(--ink-faint);font-family:var(--mono)">${code}</span></h2>
    <div class="dsub">오늘 장중 잠정치 — 외국인·기관은 KIS API 특성상 매수/매도 개별 조회가 안 되어 순매수만 제공됩니다</div>
    <table class="dtable dtable-flow">
      <thead><tr><th style="text-align:left">구분</th><th>매도</th><th>매수</th><th>순매수</th></tr></thead>
      <tbody>
        <tr><td class="dlabel">외국인</td><td colspan="2" class="empty-note" style="padding:6px 0">개별 조회 불가</td>
          <td>${netCell(frgnQty, frgnAmt)}</td></tr>
        <tr><td class="dlabel">기관</td><td colspan="2" class="empty-note" style="padding:6px 0">개별 조회 불가</td>
          <td>${netCell(orgnQty, orgnAmt)}</td></tr>
        ${trioRow("프로그램매매", progTrio)}
      </tbody>
    </table>
    ${daily ? `
    <div class="dsub" style="margin-top:16px">전일(${daily[0].slice(4,6)}/${daily[0].slice(6)}) 확정치 — 장 마감 후 최종 집계된 수치</div>
    <table class="dtable dtable-flow">
      <thead><tr><th style="text-align:left">구분</th><th>매도</th><th>매수</th><th>순매수</th></tr></thead>
      <tbody>
        ${trioRow("외국인", daily[1])}
        ${trioRow("기관", daily[2])}
        ${trioRow("개인", daily[3])}
      </tbody>
    </table>` : `<div class="empty-note" style="margin-top:12px">전일 확정치를 조회하지 못했습니다.</div>`}`;
}

function setView(v){
  curView = v;
  document.querySelectorAll('[role="tab"]').forEach(b =>
    b.setAttribute("aria-selected", String(b.dataset.view === v)));
  $("#view-matrix").hidden = v !== "matrix";
  $("#view-rank").hidden   = v !== "rank";
  if (v === "rank") renderRank();
}

document.querySelectorAll('[role="tab"]').forEach(b =>
  b.addEventListener("click", () => setView(b.dataset.view)));

$("#rankSlot").addEventListener("change", e => { rankIdx = +e.target.value; renderRank(); });


/* ---------------- 현재 시각 배지 ---------------- */
function tickClock(){
  const now = new Date();
  const kst = new Date(now.toLocaleString("en-US", {timeZone:"Asia/Seoul"}));
  const hh = String(kst.getHours()).padStart(2,"0");
  const mm = String(kst.getMinutes()).padStart(2,"0");
  const ss = String(kst.getSeconds()).padStart(2,"0");
  $("#nowClock").textContent = `현재 ${hh}:${mm}:${ss}`;
}
tickClock();
setInterval(tickClock, 1000);

render();
</script>
